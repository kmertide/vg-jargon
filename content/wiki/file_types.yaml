- id: ft-013
  type: basic
  front: What is ODGI (vg flavor)?
  back: '"Optimized Dynamic Genome/Graph Implementation" format.

    Extension: `.odgi`

    Status: Removed

    Notes: vg used to support a version implemented in [libbdsg](https://github.com/vgteam/libbdsg),
    which was **NOT** wire-compatible with the version implemented in [the odgi project](https://github.com/pangenome/odgi),
    and so was removed.'
  tags:
  - file-types
  - reference-formats
  difficulty: intermediate
  source: vg.wiki/File-Types.md
