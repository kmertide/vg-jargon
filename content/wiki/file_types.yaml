- id: ft-011
  type: basic
  front: What is Memory-Mapped PackedGraph?
  back: 'A version of PackedGraph that can be incrementally read from disk

    Extension: `.mpg`?

    Status: Experimental

    Notes: Might not actually be adopted; GBZ solves a different but often more important
    problem'
  tags:
  - file-types
  - reference-formats
  difficulty: intermediate
