- id: ft-007
  type: basic
  front: What is HashGraph?
  back: 'Graph format based on a hashtable, from [libbdsg](https://github.com/vgteam/libbdsg).

    Extension: `.hg`, `.vg`

    Status: Recommended

    Notes: Default output format of many vg subcommands as of v1.40.0.'
