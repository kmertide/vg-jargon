deck: vg-jargon::wiki::file-types
description: File formats and extensions in the vg ecosystem
source_repo: vg.wiki
cards:
- id: ft-001
  type: basic
  front: What is VG Protobuf?
  back: 'The original vg graph format

    Extension: `.vg`

    Status: Conditionally useful

    Notes: Can also be used to store paths without the nodes and edges they belong
    to. Default output format of `vg construct` in vg v1.40.0, since it can be generated
    incrementally. Can be concatenated with `cat`. Usually block-GZIP compressed,
    but some old files aren''t. Consists of count-prefixed groups of length-prefixed
    Protobuf messages, where a string type tag takes the place of the first message
    in each group.'
  tags:
  - file-types
  - reference-formats
  difficulty: intermediate
  source: vg.wiki/File-Types.md
- id: ft-002
  type: basic
  front: What file extension is used for VG Protobuf?
  back: '`.vg`'
  tags:
  - file-types
  - extensions
  difficulty: beginner
  source: vg.wiki/File-Types.md
- id: ft-003
  type: basic
  front: What is GBZ?
  back: '"GBZ" graph, a compressed format storing a graph as traversed by sample haplotypes

    Extension: `.gbz`

    Status: Recommended

    Notes: Stores not only the graph but also large numbers of haplotypes, so you
    don''t need an additional GBWT file. Internally, stores a GBWT and a GBWTGraph.
    Can''t store edges that are not followed.'
  tags:
  - file-types
  - reference-formats
  difficulty: beginner
  source: vg.wiki/File-Types.md
- id: ft-004
  type: basic
  front: What file extension is used for GBZ?
  back: '`.gbz`'
  tags:
  - file-types
  - extensions
  difficulty: beginner
  source: vg.wiki/File-Types.md
- id: ft-005
  type: basic
  front: What is [[GFA\?
  back: 'File-Formats#gfa-graph-fragment--assembly-format]]

    Extension: [Graphical Fragment Assembly](https://gfa-spec.github.io/GFA-spec/GFA1.html):
    a text-based format for storing graphs and their embedded paths.

    Status: `.gfa`

    Notes: Recommended for interchange'
  tags:
  - file-types
  - reference-formats
  difficulty: intermediate
  source: vg.wiki/File-Types.md
