- id: ft-019
  type: basic
  front: What is VG JSON?
  back: 'This is the VG Protobuf format, with the Protobuf `Graph` objects represented
    as JSON.

    Extension: `.json`

    Status: Conditionally useful

    Notes: Useful for exporting small graphs for analysis with `jq`, or importing
    graphs from tools that can''t use `libbdsg` or `libvgio`. Generally GFA should
    be used instead.'
