  - extensions
  difficulty: beginner
  source: vg.wiki/File-Types.md
- id: ft-009
  type: basic
  front: What is PackedGraph?
  back: 'Graph format based on succinct data structures, from [libbdsg](https://github.com/vgteam/libbdsg).

    Extension: `.pg`, `.vg`

    Status: Recommended for large graphs

    Notes: This format can store graphs in less space than HashGraph, but is also
    slower and more complicated.'
  tags:
  - file-types
  - reference-formats
  difficulty: intermediate
  source: vg.wiki/File-Types.md
