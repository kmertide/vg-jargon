  type: basic
  front: What is Indexed VG Protobuf?
  back: 'This is the VG Protobuf format, stored in a sorted order with an auxilliary
    index file for random access.

    Extension: `.sorted.vg`

    Status: Deprecated

    Notes: Was never very popular, and Memory-Mapped PackedGraph is intended as a
    replacement.'
