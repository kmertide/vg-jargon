deck: vg-jargon::releases::v1.77.0
description: Notable changes in vg v1.77.0
source_repo: vg

cards:
  - id: rel-001
    type: basic
    front: What commands are marked as deprecated in vg v1.77.0?
    back: |
      `vg mcmc` and `vg genotype` are marked as deprecated.
    tags: [release, v1.77.0, deprecated]
    difficulty: intermediate

  - id: rel-002
    type: basic
    front: How does `vg call` behave in vg v1.77.0?
    back: |
      `vg call` will call against a non-reference path if you explicitly ask.
    tags: [release, v1.77.0, vg-call]
    difficulty: intermediate

  - id: rel-003
    type: basic
    front: What error does `vg augment -i` produce in vg v1.77.0?
    back: |
      `vg augment -i` errors when it is told to embed a path without a name.
    tags: [release, v1.77.0, vg-augment]
    difficulty: intermediate

  - id: rel-004
    type: basic
    front: What improvements were made to `vg snarls --traversals` in vg v1.77.0?
    back: |
      `vg snarls --traversals` related helptext improved and useful errors added.
    tags: [release, v1.77.0, vg-snarls]
    difficulty: intermediate

  - id: rel-005
    type: basic
    front: What happened to `vg snarls --pathnames` in vg v1.77.0?
    back: |
      `vg snarls --pathnames` option removed (didn't really work).
    tags: [release, v1.77.0, vg-snarls]
    difficulty: intermediate

  - id: rel-006
    type: basic
    front: How are snarl ids in vg deconstruct vcfs consistent in vg v1.77.0?
    back: |
      Snarl ids in vg deconstruct vcfs now consistent with vg call (forward on reference).
    tags: [release, v1.77.0, vg-deconstruct]
    difficulty: intermediate

  - id: rel-007
    type: basic
    front: What changes were made to the gref segments algorithm in vg v1.77.0?
    back: |
      Make gref segments table more BED-like, and easier to filter by snarl level.
      Simplify gref segments algorithm; make it greedier on length and only consider things well-anchored to a reference.
    tags: [release, v1.77.0, gref-segments]
    difficulty: intermediate

  - id: rel-008
    type: basic
    front: What new option was added to `vg deconstruct` and `vg call` in vg v1.77.0?
    back: |
      `vg deconstruct -L` option ported to `vg call` to cluster big alleles. Both now support deletions. Remains experimental.
    tags: [release, v1.77.0, vg-deconstruct, vg-call]
    difficulty: intermediate

  - id: rel-009
    type: basic
    front: What was removed in vg v1.77.0?
    back: |
      `vg chain` and associated iterator used only in testing were removed.
    tags: [release, v1.77.0, removed]
    difficulty: intermediate

  - id: rel-010
    type: basic
    front: What changes were made to the manpage generator in vg v1.77.0?
    back: |
      Manpage generator is required to include non-deprecated subcommands (and is updated to do so).
    tags: [release, v1.77.0, manpage-generator]
    difficulty: intermediate

  - id: rel-011
    type: basic
    front: What new file is included in vg v1.77.0?
    back: |
      A `CONTRIBUTING.md` file was added.
    tags: [release, v1.77.0, contributing]
    difficulty: beginner

  - id: rel-012
    type: basic
    front: What was clarified in vg v1.77.0 regarding `vg map --gbwt-name`?
    back: |
      `vg map --gbwt-name` option was explained (resolves #1429).
    tags: [release, v1.77.0, vg-map]
    difficulty: intermediate

  - id: rel-013
    type: basic
    front: What optimizations were made to `vg giraffe` chaining modes in vg v1.77.0?
    back: |
      `vg giraffe` chaining mode (`-b hifi`, `-b r10`, `-b chaining-sr`) memory & speed optimizations; no effect on output.
    tags: [release, v1.77.0, vg-giraffe]
    difficulty: advanced

  - id: rel-014
    type: basic
    front: What GBZ version support was added in vg v1.77.0?
    back: |
      Support for GBZ version 3 (vg still writes version 2 by default).
    tags: [release, v1.77.0, gbz]
    difficulty: intermediate

  - id: rel-015
    type: basic
    front: What new option was added to `vg gbwt` in vg v1.77.0?
    back: |
      `vg gbwt` option `--gbz-version` for selecting the version of output GBZ.
    tags: [release, v1.77.0, vg-gbwt]
    difficulty: intermediate

  - id: rel-016
    type: basic
    front: What change was made to `vg construct -S` in vg v1.77.0?
    back: |
      `vg construct -S` will automatically turn on `-f` (resolves #2932).
    tags: [release, v1.77.0, vg-construct]
    difficulty: intermediate

  - id: rel-017
    type: basic
    front: How does `vg giraffe --max-chains-per-tree` work in vg v1.77.0?
    back: |
      `vg giraffe --max-chains-per-tree` works as documented (bugfix).
    tags: [release, v1.77.0, vg-giraffe]
    difficulty: advanced

  - id: rel-018
    type: basic
    front: What change was made to `vg giraffe --min-chains` in vg v1.77.0?
    back: |
      `vg giraffe --min-chains` is now `--target-alignment-attempts` and has better documentation.
    tags: [release, v1.77.0, vg-giraffe]
    difficulty: intermediate

  - id: rel-019
    type: basic
    front: What requirement was added to `vg surject` in vg v1.77.0?
    back: |
      `vg surject` now requires either `-i`/`--interleaved` or `-U`/`--force-unpaired` if it thinks the input smells like paired-end data.
    tags: [release, v1.77.0, vg-surject]
    difficulty: intermediate

  - id: rel-020
    type: basic
    front: How does `vg giraffe` now use the GAM fragment length distribution in vg v1.77.0?
    back: |
      `vg giraffe` now uses the GAM fragment length distribution built-in field, like `vg map`, instead of a `"fragment_length_distribution"` annotation.
    tags: [release, v1.77.0, vg-giraffe]
    difficulty: advanced

  - id: rel-021
    type: basic
    front: How does `dozeu` behave in vg v1.77.0?
    back: |
      `dozeu` respects X-drop definition more strictly.
    tags: [release, v1.77.0, dozeu]
    difficulty: advanced

  - id: rel-022
    type: basic
    front: What change was made to `vg gamsort` in vg v1.77.0?
    back: |
      `vg gamsort` no longer crashes with very large GAM files.
    tags: [release, v1.77.0, vg-gamsort]
    difficulty: intermediate

  - id: rel-023
    type: basic
    front: How does `vg gamsort` sort GAF in vg v1.77.0?
    back: |
      `vg gamsort` sorts GAF by GBWT node id intervals for better compatibility with GAF-base.
    tags: [release, v1.77.0, vg-gamsort]
    difficulty: intermediate

  - id: rel-024
    type: basic
    front: What new option was added to `vg gamsort` in vg v1.77.0?
    back: |
      `vg gamsort` option `--two-merge-rounds` to guarantee at most two rounds of merges when sorting GAF.
    tags: [release, v1.77.0, vg-gamsort]
    difficulty: intermediate

  - id: rel-025
    type: basic
    front: How does `vg giraffe` and `vg surject` handle paired-end reads in vg v1.77.0?
    back: |
      `vg giraffe` and `vg surject` now surject paired-end reads with the same code.
    tags: [release, v1.77.0, vg-giraffe, vg-surject]
    difficulty: intermediate

  - id: rel-026
    type: basic
    front: What change was made to submodule URLs in vg v1.77.0?
    back: |
      `cairo` and `pixman` submodules pulled from `https://gitlab.freedesktop.org` instead of `git://anongit.freedesktop.org` since the latter seems to have broken.
    tags: [release, v1.77.0, submodules]
    difficulty: intermediate

  - id: rel-027
    type: basic
    front: How does `vg giraffe` chaining mode handle multiplicities in vg v1.77.0?
    back: |
      Avoid underflowing multiplicities in `vg giraffe` chaining mode (caused erroneous MAPQ 0).
    tags: [release, v1.77.0, vg-giraffe]
    difficulty: advanced
